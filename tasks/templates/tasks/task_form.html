{% extends "tasks/base.html" %}

{% block content %}
    <div class="card">
        <h2>Task Form</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Save</button>
            <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
