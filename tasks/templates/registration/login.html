{% extends "tasks/base.html" %}

{% block content %}
    <div class="card">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Login</button>
        </form>
        <p>No account? <a href="{% url 'register' %}">Register here</a></p>
    </div>
{% endblock %}
